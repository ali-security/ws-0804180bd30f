name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional space-separated Mocha test selectors
        required: false
        default: ''

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch:
          - x64
          - x86
        node:
          - 18
          - 10
          - 12
          - 14
          - 16
          - 19
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macos-latest
          - arch: x86
            os: ubuntu-latest
          - arch: x86
            node: 18
            os: windows-latest
          - node: 10
            os: macos-latest
          - node: 12
            os: macos-latest
          - node: 14
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - run: npm install
      - name: Test
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha --throw-deprecation ${{ inputs.test-filter }}
          else
            npm test
          fi
      - name: Pack the release tarball
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        run: |
          npm i -g npm@8.19.2
          npm pack
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        with:
          name: npm-tarball
          path: ws-8.11.0.tgz
          if-no-files-found: error
